<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tembak Musuh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="../index.html" class="back">← Kembali ke situs</a>

  <main class="game">
    <h1>Tembak Musuh</h1>
    <p class="rules">Klik 👾 untuk +1 poin. Jangan klik 🕊️, kena -2 poin.</p>

    <div class="stats">
      <div>Skor <strong id="score">0</strong></div>
      <div>Waktu <strong id="time">30</strong></div>
      <div>Terbaik <strong id="best">0</strong></div>
    </div>

    <div id="grid" class="grid"></div>

    <p id="message" class="message">Tekan Mulai untuk main.</p>
    <button id="startBtn" class="start">Mulai</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
